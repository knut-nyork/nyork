<!-- @dsCard group="Colors" viewport="700x220" name="Semantic surfaces &amp; text" subtitle="background/foreground/link tokens used across the site" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;gap:8;font-family:var(--font-body);font-size:13px">
<div style="flex:1;background:var(--semantic-color-background-surface-1);padding:12px;border-radius:8px;color:var(--semantic-color-foreground-default)">surface-1<br><span style="color:var(--semantic-color-foreground-muted)">muted text</span></div>
<div style="flex:1;background:var(--semantic-color-background-surface-2);padding:12px;border-radius:8px;color:var(--semantic-color-foreground-default)">surface-2</div>
<div style="flex:1;background:var(--semantic-color-background-surface-3);padding:12px;border-radius:8px;color:var(--semantic-color-foreground-default)">surface-3</div>
<div style="flex:1;background:var(--semantic-color-background-surface-4);padding:12px;border-radius:8px;color:var(--semantic-color-foreground-default)">surface-4</div>
<div style="flex:1;background:var(--semantic-color-background-surface-inreverse);padding:12px;border-radius:8px;color:var(--semantic-color-foreground-inreverse)">inreverse<br><a href="#" style="color:var(--semantic-color-link-default)">link</a></div>
</div>
