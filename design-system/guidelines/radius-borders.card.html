<!-- @dsCard group="Spacing" viewport="700x180" name="Radius &amp; borders" subtitle="4/8/12/pill corner radii and hairline borders used on cards" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;gap:16;align-items:center">
<div style="width:60px;height:60px;background:var(--core-brand-100);border-radius:calc(var(--rounded-rounded)*1px)"></div>
<div style="width:60px;height:60px;background:var(--core-brand-100);border-radius:calc(var(--borderradius-small)*1px)"></div>
<div style="width:60px;height:60px;background:var(--core-brand-100);border-radius:calc(var(--borderradius-medium)*1px)"></div>
<div style="width:60px;height:60px;background:var(--core-neutral-050);border-radius:calc(var(--borderradius-medium)*1px);box-shadow:inset 0 0 0 1px var(--semantic-color-border-default)"></div>
<div style="width:60px;height:60px;background:var(--core-brand-600);border-radius:calc(var(--borderradius-pill)*1px)"></div>
</div>
